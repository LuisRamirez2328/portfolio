  <text x="400" y="355" text-anchor="middle" font-family="Arial" font-size="10" fill="#777">4 pantallas principales: Dashboard, Kanban, Tabla, Formulario</text>
  <text x="400" y="375" text-anchor="middle" font-family="Arial" font-size="10" fill="#aaa">El formulario incluye: empresa, puesto, estado, prioridad, URL, notas, fecha de aplicación</text>
