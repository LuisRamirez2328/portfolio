  <text x="400" y="355" text-anchor="middle" font-family="Arial" font-size="10" fill="#777">Real-time kanban con GraphQL subscriptions · JWT auth · Roles por board</text>
  <text x="400" y="375" text-anchor="middle" font-family="Arial" font-size="10" fill="#aaa">Next.js + urql · Apollo Server · Prisma · PostgreSQL/SQLite · Docker</text>
