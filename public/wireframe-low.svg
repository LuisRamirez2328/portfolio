  <text x="400" y="420" text-anchor="middle" font-family="Arial" font-size="10" fill="#777">4 pantallas · navegación por bottom tabs · detalle con overlay</text>
  <text x="400" y="440" text-anchor="middle" font-family="Arial" font-size="10" fill="#aaa">Nota: Los wireframes de baja fidelidad se crean en papel o herramienta de bocetado rápido.</text>
  <text x="400" y="460" text-anchor="middle" font-family="Arial" font-size="10" fill="#aaa">El prototipo interactivo se creará en Adobe XD con base en estos wireframes.</text>
