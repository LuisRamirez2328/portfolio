    <rect x="128" y="34" width="97" height="36" rx="6" fill="none" stroke="#999" stroke-dasharray="3,2"/>
    <text x="138" y="48" font-family="Arial" font-size="7" fill="#777">Promedio/mes</text>
    <text x="138" y="62" font-family="Arial" font-size="12" font-weight="bold" fill="#111">$713</text>
    <text x="15" y="90" font-family="Arial" font-size="10" font-weight="bold" fill="#111">Gastos por categoría</text>
    <rect x="15" y="98" width="210" height="60" rx="8" fill="none" stroke="#ccc"/>
    <rect x="30" y="110" width="80" height="8" rx="4" fill="none" stroke="#999"/>
    <rect x="30" y="122" width="60" height="8" rx="4" fill="none" stroke="#999"/>
    <rect x="30" y="134" width="40" height="8" rx="4" fill="none" stroke="#999"/>
    <rect x="30" y="146" width="30" height="8" rx="4" fill="none" stroke="#999"/>
    <text x="15" y="178" font-family="Arial" font-size="10" font-weight="bold" fill="#111">Tendencia mensual</text>
    <rect x="15" y="186" width="210" height="50" rx="8" fill="none" stroke="#ccc"/>
    <polyline points="30,220 60,210 90,215 120,200 150,205 180,195 210,208" fill="none" stroke="#999" stroke-width="1.5"/>
    <text x="15" y="260" font-family="Arial" font-size="10" font-weight="bold" fill="#111">Patrón semanal</text>
    <rect x="15" y="268" width="210" height="30" rx="8" fill="none" stroke="#ccc"/>
  </g>

  <!-- TABLA -->
  <g transform="translate(280, 48)">
    <rect width="240" height="280" rx="12" fill="none" stroke="#111" stroke-width="1.5"/>
