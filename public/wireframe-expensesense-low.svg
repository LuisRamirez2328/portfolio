<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#fafafa"/>
  <text x="400" y="28" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#111">EXPENSESENSE — WIREFRAMES BAJA FIDELIDAD</text>

  <!-- DASHBOARD -->
  <g transform="translate(20, 48)">
