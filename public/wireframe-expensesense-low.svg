    <rect x="15" y="34" width="210" height="24" rx="6" fill="none" stroke="#999"/>
    <text x="22" y="50" font-family="Arial" font-size="8" fill="#555">🔍 Filtrar por categoría, fecha...</text>
    <rect x="15" y="66" width="210" height="18" rx="3" fill="none" stroke="#ccc"/>
    <text x="22" y="79" font-family="Arial" font-size="8" font-weight="bold" fill="#111">Fecha | Categoría | Monto | Descripción</text>
    <rect x="15" y="90" width="210" height="16" rx="3" fill="none" stroke="#eee"/>
    <rect x="15" y="112" width="210" height="16" rx="3" fill="none" stroke="#eee"/>
    <rect x="15" y="134" width="210" height="16" rx="3" fill="none" stroke="#eee"/>
    <rect x="15" y="156" width="210" height="16" rx="3" fill="none" stroke="#eee"/>
    <rect x="15" y="178" width="210" height="16" rx="3" fill="none" stroke="#eee"/>
    <text x="15" y="210" font-family="Arial" font-size="9" fill="#111">← 1 2 3 4 →</text>
  </g>

  <!-- TOP EXPENSES -->
  <g transform="translate(540, 48)">
    <rect width="240" height="280" rx="12" fill="none" stroke="#111" stroke-width="1.5"/>
    <text x="15" y="24" font-family="Arial" font-size="11" font-weight="bold" fill="#111">TOP GASTOS</text>
    <rect x="15" y="34" width="210" height="28" rx="6" fill="none" stroke="#999" stroke-dasharray="3,2"/>
    <text x="22" y="48" font-family="Arial" font-size="8" fill="#555">1. Renta — $850</text>
    <rect x="15" y="68" width="210" height="28" rx="6" fill="none" stroke="#999" stroke-dasharray="3,2"/>
    <text x="22" y="82" font-family="Arial" font-size="8" fill="#555">2. Supermercado — $420</text>
    <rect x="15" y="102" width="210" height="28" rx="6" fill="none" stroke="#999" stroke-dasharray="3,2"/>
    <text x="22" y="116" font-family="Arial" font-size="8" fill="#555">3. Transporte — $180</text>
    <rect x="15" y="136" width="210" height="28" rx="6" fill="none" stroke="#999" stroke-dasharray="3,2"/>
    <text x="22" y="150" font-family="Arial" font-size="8" fill="#555">4. Entretenimiento — $150</text>
    <rect x="15" y="170" width="210" height="28" rx="6" fill="none" stroke="#999" stroke-dasharray="3,2"/>
    <text x="22" y="184" font-family="Arial" font-size="8" fill="#555">5. Suscripciones — $120</text>
    <text x="15" y="220" font-family="Arial" font-size="10" font-weight="bold" fill="#111">Upload CSV</text>
    <rect x="15" y="228" width="210" height="40" rx="8" fill="none" stroke="#999" stroke-dasharray="4,2"/>
    <text x="80" y="252" font-family="Arial" font-size="9" fill="#775">📁 Arrastra tu CSV aquí</text>
  </g>

  <text x="400" y="355" text-anchor="middle" font-family="Arial" font-size="10" fill="#777">3 pantallas: Dashboard analítico, Tabla de gastos, Top gastos + Upload CSV</text>
  <text x="400" y="375" text-anchor="middle" font-family="Arial" font-size="10" fill="#aaa">Backend FastAPI + pandas procesa CSV y sirve analytics via REST API</text>
</svg>
