    <rect x="15" y="34" width="105" height="36" rx="6" fill="#1e293b"/>
    <text x="25" y="48" font-family="Arial" font-size="7" fill="#94a3b8">Total gastos</text>
    <text x="25" y="62" font-family="Arial" font-size="12" font-weight="bold" fill="#f472b6">$4,280</text>
    <rect x="128" y="34" width="97" height="36" rx="6" fill="#1e293b"/>
    <text x="138" y="48" font-family="Arial" font-size="7" fill="#94a3b8">Promedio/mes</text>
    <text x="138" y="62" font-family="Arial" font-size="12" font-weight="bold" fill="#a78bfa">$713</text>
    <text x="15" y="90" font-family="Arial" font-size="10" font-weight="bold" fill="#e5e7eb">Categorías</text>
    <rect x="15" y="98" width="210" height="60" rx="8" fill="#0f172a"/>
    <rect x="25" y="108" width="90" height="8" rx="4" fill="#f472b6" opacity="0.7"/>
    <rect x="25" y="120" width="65" height="8" rx="4" fill="#a78bfa" opacity="0.7"/>
    <rect x="25" y="132" width="45" height="8" rx="4" fill="#34d399" opacity="0.7"/>
    <rect x="25" y="144" width="30" height="8" rx="4" fill="#fbbf24" opacity="0.7"/>
    <text x="15" y="178" font-family="Arial" font-size="10" font-weight="bold" fill="#e5e7eb">Tendencia mensual</text>
    <rect x="15" y="186" width="210" height="50" rx="8" fill="#0f172a"/>
    <polyline points="30,220 60,210 90,215 120,200 150,205 180,195 210,208" fill="none" stroke="#f472b6" stroke-width="1.5"/>
    <text x="15" y="260" font-family="Arial" font-size="10" font-weight="bold" fill="#e5e7eb">Patrón semanal</text>
    <rect x="15" y="268" width="210" height="30" rx="8" fill="#0f172a"/>
  </g>

  <!-- TABLE -->
  <g transform="translate(280, 48)">
    <rect width="240" height="280" rx="12" fill="#1a1a2e" stroke="#334155" stroke-width="1"/>
    <text x="15" y="24" font-family="Arial" font-size="11" font-weight="bold" fill="#e5e7eb">Tabla de Gastos</text>
    <rect x="15" y="34" width="210" height="24" rx="6" fill="#0f172a"/>
    <text x="22" y="50" font-family="Arial" font-size="8" fill="#64748b">🔍 Filtrar por categoría, fecha...</text>
    <rect x="15" y="66" width="210" height="18" rx="3" fill="#0f172a"/>
    <text x="22" y="79" font-family="Arial" font-size="8" font-weight="bold" fill="#94a3b8">Fecha | Categoría | Monto | Descripción</text>
    <rect x="15" y="90" width="210" height="16" rx="3" fill="#1e293b"/>
    <rect x="15" y="112" width="210" height="16" rx="3" fill="#0f172a"/>
    <rect x="15" y="134" width="210" height="16" rx="3" fill="#1e293b"/>
    <rect x="15" y="156" width="210" height="16" rx="3" fill="#0f172a"/>
    <rect x="15" y="178" width="210" height="16" rx="3" fill="#1e293b"/>
    <text x="15" y="210" font-family="Arial" font-size="9" fill="#94a3b8">← 1 2 3 4 →</text>
  </g>

  <!-- TOP + UPLOAD -->
  <g transform="translate(540, 48)">
    <rect width="240" height="280" rx="12" fill="#1a1a2e" stroke="#334155" stroke-width="1"/>
    <text x="15" y="24" font-family="Arial" font-size="11" font-weight="bold" fill="#e5e7eb">Top Gastos + Upload</text>
    <rect x="15" y="34" width="210" height="28" rx="6" fill="#1e293b"/>
    <text x="22" y="48" font-family="Arial" font-size="8" fill="#f472b6">1. Renta — $850</text>
    <rect x="15" y="68" width="210" height="28" rx="6" fill="#1e293b"/>
    <text x="22" y="82" font-family="Arial" font-size="8" fill="#a78bfa">2. Supermercado — $420</text>
    <rect x="15" y="102" width="210" height="28" rx="6" fill="#1e293b"/>
    <text x="22" y="116" font-family="Arial" font-size="8" fill="#34d399">3. Transporte — $180</text>
    <rect x="15" y="170" width="210" height="40" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="80" y="194" font-family="Arial" font-size="9" fill="#94a3b8">📁 Arrastra tu CSV aquí</text>
    <rect x="15" y="218" width="210" height="28" rx="6" fill="#f472b6" opacity="0.9"/>
    <text x="80" y="236" font-family="Arial" font-size="9" font-weight="bold" fill="#0f172a">Subir archivo</text>
  </g>

  <text x="400" y="355" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">Tema oscuro con acentos rosa (#f472b6) y violeta (#a78bfa)</text>
</svg>
