<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#111"/>
  <text x="400" y="28" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#e5e7eb">EXPENSESENSE — WIREFRAMES MEDIA FIDELIDAD</text>

  <!-- DASHBOARD -->
  <g transform="translate(20, 48)">
    <rect width="240" height="280" rx="12" fill="#1a1a2e" stroke="#334155" stroke-width="1"/>
