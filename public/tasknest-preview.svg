<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1111"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <text x="40" y="80" font-family="monospace" font-size="26" font-weight="bold" fill="#fafafa">TaskNest API</text>
  <text x="40" y="104" font-family="monospace" font-size="13" fill="#737373">Laravel 13 · PHP 8.4 · Sanctum · Eloquent</text>

  <rect x="40" y="136" width="340" height="244" rx="12" fill="#111111" stroke="#262626"/>
  <text x="56" y="162" font-family="monospace" font-size="12" font-weight="bold" fill="#22c55e">routes/api.php</text>
  <text x="56" y="188" font-family="monospace" font-size="12" fill="#737373">POST  /api/register</text>
  <text x="56" y="208" font-family="monospace" font-size="12" fill="#737373">POST  /api/login</text>
  <text x="56" y="228" font-family="monospace" font-size="12" fill="#737373">GET   /api/me</text>
  <text x="56" y="248" font-family="monospace" font-size="12" fill="#737373">GET   /api/tasks?status=pending</text>
  <text x="56" y="268" font-family="monospace" font-size="12" fill="#737373">POST  /api/tasks</text>
  <text x="56" y="288" font-family="monospace" font-size="12" fill="#737373">PATCH /api/tasks/{id}</text>
  <text x="56" y="308" font-family="monospace" font-size="12" fill="#737373">DELETE /api/tasks/{id}</text>
  <text x="56" y="328" font-family="monospace" font-size="12" fill="#737373">PATCH /api/tasks/{id}/restore</text>
  <rect x="56" y="344" width="300" height="1" fill="#262626"/>
  <text x="56" y="366" font-family="monospace" font-size="11" fill="#525252">auth:sanctum · TaskPolicy · API Resources</text>

  <rect x="410" y="136" width="350" height="120" rx="12" fill="#111111" stroke="#262626"/>
  <text x="426" y="160" font-family="monospace" font-size="11" fill="#737373">$ curl /api/tasks?priority=high</text>
  <text x="426" y="182" font-family="monospace" font-size="11" fill="#fafafa">{</text>
  <text x="436" y="198" font-family="monospace" font-size="11" fill="#a3a3a3">"data": {</text>
  <text x="446" y="214" font-family="monospace" font-size="11" fill="#e5e5e5">"title": "Revisar pull requests",</text>
  <text x="446" y="230" font-family="monospace" font-size="11" fill="#e5e5e5">"status": "in_progress",</text>
  <text x="446" y="246" font-family="monospace" font-size="11" fill="#f5c518">"priority": "high"</text>

  <rect x="410" y="272" width="170" height="108" rx="12" fill="#111111" stroke="#262626"/>
  <text x="426" y="298" font-family="monospace" font-size="11" font-weight="bold" fill="#fafafa">php artisan test</text>
  <rect x="426" y="312" width="138" height="18" rx="6" fill="#171717"/>
  <rect x="426" y="312" width="103" height="18" rx="6" fill="#22c55e"/>
  <text x="432" y="325" font-family="monospace" font-size="9" fill="#0a0a0a">25 passed</text>
  <text x="426" y="352" font-family="monospace" font-size="11" fill="#737373">OK (25 tests, 81 assert.)</text>

  <rect x="596" y="272" width="164" height="108" rx="12" fill="#111111" stroke="#262626"/>
  <text x="612" y="298" font-family="monospace" font-size="11" font-weight="bold" fill="#fafafa">CI · GitHub Actions</text>
  <circle cx="622" cy="322" r="4" fill="#22c55e"/>
  <text x="634" y="326" font-family="monospace" font-size="11" fill="#a3a3a3">Pint --test</text>
  <circle cx="622" cy="344" r="4" fill="#22c55e"/>
  <text x="634" y="348" font-family="monospace" font-size="11" fill="#a3a3a3">PHPUnit · SQLite :memory:</text>

  <text x="40" y="410" font-family="monospace" font-size="11" fill="#525252">Laravel 13 · PHP 8.4 · Sanctum · Eloquent · soft deletes · Form Requests</text>
  <text x="40" y="430" font-family="monospace" font-size="11" fill="#525252">API Resources · Policies · Laravel Pint · GitHub Actions · SQLite/PostgreSQL</text>
</svg>
