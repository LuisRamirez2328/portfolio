    <text x="95" y="48" font-family="Arial" font-size="10" font-weight="bold" fill="#111">Título del Libro</text>
    <text x="95" y="62" font-family="Arial" font-size="8" fill="#777">Autor Famoso</text>
    <text x="95" y="76" font-family="Arial" font-size="7" fill="#555">Categoría: Ficción</text>
    <text x="95" y="90" font-family="Arial" font-size="7" fill="#555">Año: 2024</text>
