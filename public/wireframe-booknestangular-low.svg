    <text x="22" y="222" font-family="Arial" font-size="7" fill="#555">📚 Libros</text>
    <rect x="88" y="208" width="65" height="20" rx="4" fill="none" stroke="#999"/>
    <text x="95" y="222" font-family="Arial" font-size="7" fill="#555">✍ Autores</text>
    <rect x="161" y="208" width="65" height="20" rx="4" fill="none" stroke="#999"/>
    <text x="168" y="222" font-family="Arial" font-size="7" fill="#555">📂 Categ.</text>
    <rect x="15" y="240" width="210" height="24" rx="6" fill="none" stroke="#999"/>
    <text x="22" y="256" font-family="Arial" font-size="8" fill="#555">CRUD de libros con form</text>
  </g>

  <text x="400" y="355" text-anchor="middle" font-family="Arial" font-size="10" fill="#777">4 pantallas: Catálogo, Detalle, Préstamos, Admin CRUD</text>
  <text x="400" y="375" text-anchor="middle" font-family="Arial" font-size="10" fill="#aaa">Angular 19 SPA con lazy loading, JWT auth y guards por rol (ADMIN/USER)</text>
</svg>
