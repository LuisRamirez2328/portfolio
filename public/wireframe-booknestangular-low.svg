    <rect x="15" y="118" width="210" height="16" rx="3" fill="none" stroke="#eee"/>
    <rect x="15" y="140" width="210" height="16" rx="3" fill="none" stroke="#eee"/>
    <rect x="15" y="162" width="210" height="16" rx="3" fill="none" stroke="#eee"/>
